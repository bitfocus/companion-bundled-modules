name: Portal Update Module
run-name: "${{ github.event.inputs.run-id }}: ${{ github.event.inputs.module-name }} (${{ github.event.inputs.module-type }}) updated to ${{ github.event.inputs.git-ref }}(${{ github.event.inputs.git-sha }})"

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      run-id:
        type: string
        description: Unique identifer for this workflow run
        required: true
      module-type:
        type: choice
        description: The type of the module
        required: true
        options:
          - connection
          - surface
      module-name:
        type: string
        description: Name of the module (eg bmd-atem)
        required: true
      git-ref:
        type: string
        description: Git ref to build
        required: true
      git-sha:
        type: string
        description: Git sha to build
        required: true
      prerelease:
        type: boolean
        description: "If set, this is a prerelease"
        required: false
        default: false

jobs:
  build:
    name: Build module

    # The first stage is to build their module
    # Remember that this is running user code, so we need to make sure not to leak any secrets

    permissions:
      packages: read

    uses: bitfocus/actions/.github/workflows/module-checks.yaml@main
    with:
      repository-name: bitfocus/companion-${{ (github.event.inputs.module-type == 'connection' && 'module') || github.event.inputs.module-type }}-${{ github.event.inputs.module-name }}
      git-ref: ${{ github.event.inputs.git-ref }}
      git-sha-check: ${{ github.event.inputs.git-sha }}
      upload-artifact: true
      prerelease: ${{ !!inputs.prerelease }}
      is-developer-portal: true

  publish:
    runs-on: ubuntu-latest
    needs: build

    # This final stage is to publish the module to the api

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pkg

      - name: Download rclone client
        shell: bash
        env:
          RCLONE_VERSION: "1.75.1"
          RCLONE_SHA256: "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab"
        run: |
          set -euo pipefail
          archive="rclone.zip"
          extract_dir="rclone-extracted"
          curl --fail --location --silent --show-error --retry 3 \
            -o "$archive" \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          printf '%s  %s\n' "$RCLONE_SHA256" "$archive" | sha256sum --check --status
          rm -rf "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"
          install -m 0755 "$extract_dir/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" ./rclone
          rm -rf "$archive" "$extract_dir"

      - name: Upload
        id: upload
        shell: bash
        env:
          S3_HOST: ${{ vars.S3_HOST }}
          S3_REGION: ${{ vars.S3_REGION || 'eu-north-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET }}
        run: |
          # extract the package
          tar -xvzf pkg.tgz

          # The extracted folder may be named 'pkg' or the module name - normalize to 'pkg'
          if [ ! -d "pkg" ] && [ -d "${{ github.event.inputs.module-name }}" ]; then
            mv "${{ github.event.inputs.module-name }}" pkg
          fi

          # include part of the package hash, so that a rerun doesn't overwrite a previous upload
          PKG_SHA256=$(sha256sum pkg.tgz | awk '{print $1}')
          GIT_SHA="${{ github.event.inputs.git-sha }}"

          ARTIFACT_DIR="${{ github.event.inputs.module-type }}/${{ github.event.inputs.module-name }}/${{ github.event.inputs.git-ref }}-${GIT_SHA:0:12}-${PKG_SHA256:0:12}"
          ARTIFACT_NAME="${{ github.event.inputs.module-name }}-${{ github.event.inputs.git-ref }}.tgz"

          # copy the package to the companion directory
          cp pkg.tgz "pkg/companion/${ARTIFACT_NAME}"


          export RCLONE_CONFIG_REMOTE_TYPE="s3"
          export RCLONE_CONFIG_REMOTE_PROVIDER="Other"
          export RCLONE_CONFIG_REMOTE_ENV_AUTH="false"
          export RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID="$S3_ACCESS_KEY"
          export RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
          export RCLONE_CONFIG_REMOTE_ENDPOINT="https://${S3_HOST}"
          export RCLONE_CONFIG_REMOTE_REGION="$S3_REGION"

          # rcat writes one remote object, like S3 PutObject.
          (cd pkg/companion && find . -type f -print0) | while IFS= read -r -d '' file; do
            file="${file#./}"
            FILE_SIZE=$(wc -c < "pkg/companion/${file}" | tr -d '[:space:]')
            ./rclone rcat "remote:${S3_BUCKET}/${ARTIFACT_DIR}/${file}" \
              --size "$FILE_SIZE" --s3-no-head --s3-no-check-bucket < "pkg/companion/${file}"
          done

          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "artifact-url=https://${S3_BUCKET}.${S3_HOST}/${ARTIFACT_DIR}" >> $GITHUB_OUTPUT
          echo "pkg-sha256=${PKG_SHA256}" >> $GITHUB_OUTPUT

      - name: Report to api
        shell: bash
        run: |
          echo "Uploaded build to ${{ steps.upload.outputs.artifact-url }}/${{ steps.upload.outputs.artifact-name }}" >> $GITHUB_STEP_SUMMARY

          PKG_SHA256="${{ steps.upload.outputs.pkg-sha256 }}"
          echo "With SHA256=${PKG_SHA256}" >> $GITHUB_STEP_SUMMARY

          MANIFEST_JSON=$(cat pkg/companion/manifest.json)
          MANIFEST_JSON=${MANIFEST_JSON//\"/\\\"}

          # TODO: rename logUrl property

          PUT_PAYLOAD='{
            "moduleType": "companion-${{ github.event.inputs.module-type }}",
            "moduleName": "${{ github.event.inputs.module-name }}",
            "logUrl": "https://github.com/bitfocus/companion-bundled-modules/actions/runs/${{ github.run_id }}",
            "pkgDirUrl": "${{ steps.upload.outputs.artifact-url }}",
            "pkgName": "${{ steps.upload.outputs.artifact-name }}",
            "pkgSha": "'${PKG_SHA256}'",
            "gitTag": "${{ github.event.inputs.git-ref }}",
            "gitSha": "${{ github.event.inputs.git-sha }}",
            "manifestJson": "'${MANIFEST_JSON}'"
          }'

          echo "PUT_PAYLOAD=$PUT_PAYLOAD"

          curl -X 'PUT' \
            'https://developer.bitfocus.io/api/v1/modules/package' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ${{ secrets.DEVELOPER_API_KEY }}' \
            -d "${PUT_PAYLOAD}" \
            --fail-with-body \
            --show-error
